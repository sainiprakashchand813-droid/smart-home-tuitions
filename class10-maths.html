["वास्तविक संख्याएँ","Real Numbers",["यूक्लिड विभाजन प्रमेय","अंकगणित की आधारभूत प्रमेय","अभाज्य गुणनखंड और HCF–LCM","परिमेय और अपरिमेय संख्याएँ"],["Euclid's division lemma","Fundamental theorem of arithmetic","Prime factorisation, HCF and LCM","Rational and irrational numbers"],"a/b के रूप में लिखी संख्या परिमेय है, जहाँ a,b पूर्णांक और b ≠ 0।","A rational number can be written as a/b, where a and b are integers and b ≠ 0.","यदि a=bq+r, तो 0≤r<b। दो संख्याओं के लिए HCF × LCM = उनका गुणनफल।","For positive integers a,b: HCF(a,b) × LCM(a,b) = a × b.",["135 और 225 का HCF ज्ञात करें।","यदि HCF=6 और LCM=180 है तथा एक संख्या 30 है, दूसरी ज्ञात करें।","सिद्ध करें कि √2 अपरिमेय है।"],["Find HCF of 135 and 225.","If HCF=6, LCM=180 and one number is 30, find the other.","Prove that √2 is irrational."],["225 को 3×3×5×5 लिखें। 135=3×3×3×5। समान न्यूनतम घातें: 3²×5=45।","दूसरी संख्या=(6×180)/30=36।","मान लें √2=p/q (सरलतम रूप)। तब p²=2q², इसलिए p सम; p=2k रखने पर q भी सम। यह सह-अभाज्य होने के विरुद्ध है।"],["Write 225=3²×5² and 135=3³×5. HCF=3²×5=45.","Other number=(6×180)/30=36.","Assume √2=p/q in lowest terms. Then p²=2q², so p is even; substituting p=2k makes q even too, a contradiction."]],

let selected=0,mode='notes';
const $=id=>document.getElementById(id);
function isHi(){return $('lang').value==='hi'}
function title(c){return isHi()?c[0]:c[1]}
function listChapters(){ $('chapter').innerHTML=chapters.map((c,i)=>'<option value="'+i+'">'+(i+1)+'. '+title(c)+'</option>').join(''); $('chapterList').innerHTML=chapters.map((c,i)=>'<button class="topic text-left p-2 rounded-lg text-sm" data-i="'+i+'" aria-current="'+(i===selected)+'">'+(i+1)+'. '+title(c)+'</button>').join(''); document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>showChapter(+b.dataset.i));}
function showChapter(i){selected=i;$('chapter').value=i;listChapters();render()}
function render(){const c=chapters[selected],h=isHi(),b=$('board').value;$('boardTag').textContent=b+' · CLASS 10 · MATHEMATICS';$('chapterTitle').textContent=(selected+1)+'. '+title(c);document.querySelectorAll('.tab').forEach(x=>x.className='tab px-4 py-2 rounded-lg '+(x.dataset.tab===mode?'bg-indigo-600 text-white':'bg-slate-100'));let html='';
if(mode==='notes'){const topics=h?c[2]:c[3],questions=h?c[8]:c[9],solutions=h?c[10]:c[11];html='<div class="rounded-xl bg-indigo-50 p-4 mb-4"><b>'+(h?'अध्याय का परिचय':'Chapter overview')+'</b><p class="mt-2">'+(h?c[4]:c[5])+'</p><p class="mt-2 text-sm">'+(h?'बोर्ड नोट:':'Board note:')+' '+(b==='RBSE'?(h?'राजस्थान बोर्ड की निर्धारित पुस्तक और नवीनतम पाठ्यक्रम से मिलान करें।':'Cross-check with the prescribed Rajasthan Board textbook and current syllabus.'):(h?'CBSE के नवीनतम पाठ्यक्रम और NCERT पुस्तक से मिलान करें।':'Cross-check with the latest CBSE syllabus and NCERT textbook.'))+'</p></div><h3 class="font-bold text-xl mb-2">'+(h?'विषयवार टॉपिक्स':'Topic-wise syllabus')+'</h3><ol class="list-decimal pl-6 space-y-2">'+topics.map(x=>'<li>'+x+'</li>').join('')+'</ol><h3 class="font-bold text-xl mt-6 mb-2">'+(h?'महत्वपूर्ण सिद्धांत':'Key concept')+'</h3><p>'+(h?c[4]:c[5])+'</p><h3 class="font-bold text-xl mt-6 mb-2">'+(h?'हल किए हुए उदाहरण':'Solved examples')+'</h3>'+questions.map((q,j)=>'<div class="border rounded-xl p-3 my-2"><b>'+(j+1)+'. '+q+'</b><p class="mt-2 text-emerald-700">'+solutions[j]+'</p></div>').join('')+'<p class="text-sm text-slate-500 mt-4">'+(h?'अगला चरण: हर टॉपिक के लिए अतिरिक्त अभ्यास प्रश्न और शिक्षक द्वारा सत्यापित हल जोड़ें।':'Next: add topic-specific practice sets and teacher-verified solutions.')+'</p>'}
if(mode==='formula'){html='<h3 class="font-bold text-xl mb-3">'+(h?'सूत्र पत्रक':'Formula sheet')+'</h3><div class="formula">'+(h?c[6]:c[7])+'</div><p class="mt-4">'+(h?'सूत्र लगाते समय इकाई और गणना के चरण अवश्य लिखें।':'Always show units and calculation steps when applying formulas.')+'</p>'}
if(mode==='test'){const qs=h?c[8]:c[9],solutions=h?c[10]:c[11];html='<h3 class="font-bold text-xl mb-3">'+(h?'अध्याय अभ्यास टेस्ट':'Chapter practice test')+'</h3><p class="text-sm text-slate-500 mb-4">'+(h?'पहले बिना नोट्स देखे उत्तर लिखें। फिर मॉडल उत्तर से मिलान करें।':'Answer without looking at the notes, then compare with the model answers.')+'</p>'+qs.map((q,j)=>'<div class="border rounded-xl p-3 my-3"><p class="font-semibold">'+(j+1)+'. '+q+'</p><textarea id="response'+j+'" rows="3" class="w-full border rounded-lg p-2 mt-2" placeholder="'+(h?'अपना उत्तर यहाँ लिखें':'Write your answer here')+'"></textarea><button class="show-answer mt-2 text-indigo-700 font-bold text-sm" data-answer="'+j+'">'+(h?'मॉडल उत्तर दिखाएँ':'Show model answer')+'</button><p id="model'+j+'" class="hidden mt-2 rounded-lg bg-emerald-50 text-emerald-900 p-3 text-sm">'+solutions[j]+'</p></div>').join('')+'<p class="text-xs text-slate-500">'+(h?'यह स्व-अभ्यास टेस्ट है; अपने उत्तर शिक्षक/पुस्तक से भी जाँचें।':'Self-practice test; also verify your work with a teacher or textbook.')+'</p>'}
$('content').innerHTML=html;if(mode==='test'){$('check').onclick=()=>{$('score').textContent=h?'टेस्ट अभ्यास के लिए है। प्रत्येक प्रश्न का सही हल ऊपर नोट्स में देखें।':'Practice test: refer to the solved examples in Notes to verify your work.';qsFeedback()}}
}
function qsFeedback(){chapters[selected].slice(8,10).flat().forEach((q,j)=>{const el=$('ans'+j);if(el)el.textContent=isHi()?'स्वयं हल करके नोट्स से मिलान करें।':'Solve independently and compare with Notes.'})}
$('chapter').onchange=e=>showChapter(+e.target.value);$('lang').onchange=()=>{listChapters();render()};$('board').onchange=render;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{mode=x.dataset.tab;render()});listChapters();render();
</script>
</body></html>
